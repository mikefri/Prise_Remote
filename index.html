<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prise Control Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f1f5f9; color: #334155; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .is-on { border-color: #10b981 !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.15) !important; }
        .label-text { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; }
    </style>
</head>
<body class="p-4 flex justify-center items-start min-h-screen">

    <div class="w-full max-w-md">
        <div id="config-panel" class="hidden glass p-6 mb-6 border-orange-200 bg-orange-50/50">
            <h2 class="text-sm font-black uppercase mb-4 text-orange-700">Configuration API Tuya</h2>
            <div class="space-y-3">
                <input type="text" id="cfg-id" placeholder="Access ID" class="w-full p-3 rounded-xl border-none ring-1 ring-slate-200 text-sm">
                <input type="password" id="cfg-secret" placeholder="Access Secret" class="w-full p-3 rounded-xl border-none ring-1 ring-slate-200 text-sm">
                <button onclick="saveConfig()" class="w-full py-3 bg-orange-500 text-white rounded-xl font-bold text-xs uppercase">Enregistrer & Actualiser</button>
            </div>
        </div>

        <header class="py-6 flex justify-between items-center">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-800">Prises<span class="text-emerald-500">.</span></h1>
            <div class="flex gap-2">
                <button onclick="document.getElementById('config-panel').classList.toggle('hidden')" class="p-3 glass text-slate-400">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
                </button>
                <button onclick="loadDevices()" class="p-3 glass text-emerald-500"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg></button>
            </div>
        </header>

        <main id="container" class="space-y-4 text-center">
            <p class="text-slate-400 text-sm py-10">Chargement...</p>
        </main>
    </div>

    <script>
        // --- GESTION CONFIG ---
        function checkConfig() {
            const id = localStorage.getItem('tuya_id');
            const secret = localStorage.getItem('tuya_secret');
            if(!id || !secret) {
                document.getElementById('config-panel').classList.remove('hidden');
            }
            return id && secret;
        }

        function saveConfig() {
            localStorage.setItem('tuya_id', document.getElementById('cfg-id').value);
            localStorage.setItem('tuya_secret', document.getElementById('cfg-secret').value);
            location.reload();
        }

        // --- API & LOGIQUE ---
        async function api(body) {
            try {
                const res = await fetch('/api/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        ...body, 
                        accessId: localStorage.getItem('tuya_id'), 
                        accessSecret: localStorage.getItem('tuya_secret') 
                    })
                });
                return await res.json();
            } catch (e) { return { success: false }; }
        }

        async function loadDevices() {
            if(!checkConfig()) return;
            const res = await api({ action: 'listDevices' });
            if(res.success) {
                // On affiche TOUT sans filtre pour être sûr de trouver vos appareils
                const devices = res.result;
                document.getElementById('container').innerHTML = devices.map(d => `
                    <div class="glass p-5 flex flex-col gap-4 text-left ${!d.online ? 'opacity-50' : ''}" id="card-${d.id}">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-slate-800">${d.name}</h3>
                                <p class="text-[9px] text-slate-400 uppercase font-black">${d.category} | ${d.online ? 'En ligne' : 'Hors-ligne'}</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="sw-${d.id}" onchange="toggleDevice('${d.id}', this.checked)" class="sr-only peer">
                                <div class="w-12 h-6 bg-slate-200 rounded-full peer peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-6"></div>
                            </label>
                        </div>
                        
                        <div class="pt-3 border-t border-slate-100">
                             <div class="flex justify-between items-center mb-1">
                                <span class="label-text">Minuteur (Secondes)</span>
                                <span id="val-${d.id}" class="text-xs font-bold text-emerald-600">0</span>
                             </div>
                             <input type="range" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                    min="0" max="3600" step="60" value="0"
                                    oninput="document.getElementById('val-${d.id}').innerText = this.value"
                                    onchange="sendCountdown('${d.id}', this.value)">
                        </div>
                    </div>
                `).join('');
                
                // Sync status initial
                devices.forEach(d => { if(d.online) syncStatus(d.id); });
            }
        }

        async function syncStatus(id) {
            const res = await api({ action: 'getStatus', deviceId: id });
            if(res.success && res.result) {
                const sw = res.result.find(x => x.code.includes('switch'));
                if(sw) {
                    document.getElementById(`sw-${id}`).checked = sw.value;
                    if(sw.value) document.getElementById(`card-${id}`).classList.add('is-on');
                }
                const cd = res.result.find(x => x.code.includes('countdown'));
                if(cd) {
                    document.getElementById(`val-${id}`).innerText = cd.value;
                }
            }
        }

        async function toggleDevice(id, state) {
            const card = document.getElementById(`card-${id}`);
            state ? card.classList.add('is-on') : card.classList.remove('is-on');
            await api({ action: 'send', deviceId: id, code: 'switch_1', value: state });
        }

        async function sendCountdown(id, val) {
            await api({ action: 'send', deviceId: id, code: 'countdown_1', value: parseInt(val) });
        }

        window.onload = loadDevices;
    </script>
</body>
</html>
